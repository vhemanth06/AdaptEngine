name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Fail if scratch or raw-data files are tracked (W7 T0.2)
      run: |
        tracked=$(git ls-files graphify-out learner_session.json test_snapshot.json 'data/external/*.csv')
        if [ -n "$tracked" ]; then echo "These paths must not be tracked:"; echo "$tracked"; exit 1; fi
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .
    - name: Test with pytest
      run: |
        pytest -q --cov=adaptengine --cov-fail-under=84
    - name: Run Week 6 Verification (make w6)
      run: |
        make w6

  pybkt-parity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies with pyBKT
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r requirements-pybkt.txt
        pip install -e .
    - name: Run pyBKT parity tests
      run: |
        REQUIRE_PYBKT=1 python -m pytest -q tests/test_feedback_fixes.py -k test_pybkt_adapter_genuine_parity


  # Optional demo frontend job (W7 WP8): failures here do not block the core matrix.
  demo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install engine with the demo extra
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e ".[demo]"
    - name: API tests
      run: pytest -q frontend/api/tests
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/web/package-lock.json
    - name: Build web app
      working-directory: frontend/web
      run: |
        npm ci
        npm run build
    - name: Playwright demo script
      working-directory: frontend/web
      env:
        PYTHON: python
      run: |
        npx playwright install --with-deps chromium
        npx playwright test
