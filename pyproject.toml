[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptengine"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "networkx==3.4.2"
]

[project.optional-dependencies]
pybkt = [
    "pyBKT==1.4.3",
    "numpy==1.26.4",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0,<1.6.0",
]
demo = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
]
agents = [
    "anthropic",
]
solver = [
    # <9.15: OR-Tools 9.15 needs numpy 2, which breaks pyBKT 1.4.3 (pinned to numpy 1.26.4)
    "ortools>=9.10,<9.15",
]
figures = [
    "matplotlib>=3.8",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "ruff==0.8.0",
]

[project.scripts]
adaptengine = "adaptengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptengine = ["policy/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pyBKT.*:",
]

[tool.ruff]
line-length = 100
# W8 0.2: the Week 7 review probes are kept verbatim as copied (reproducibility)
extend-exclude = [
    "experiments/probes/probe_w8.py",
    "experiments/probes/probe_w8_calib.py",
    "experiments/probes/probe_w8_sweep.py",
]
