[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptengine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "networkx==3.4.2"
]

[project.optional-dependencies]
pybkt = [
    "pyBKT==1.4.3",
    "numpy==1.26.4",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "ruff==0.8.0",
]

[project.scripts]
adaptengine = "adaptengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pyBKT.*:",
]

[tool.ruff]
line-length = 100
